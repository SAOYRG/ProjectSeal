name: Opt-in live keyless signing test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-keyless:
    # Only reviewed default-branch code may receive an OIDC token.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: signing-integration
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
        with:
          cosign-release: v3.0.2
      - run: python -m pip install -e ".[dev]"
      - name: Sign synthetic release and verify identity, manifest and tampering
        env:
          PROJECTSEAL_KEYLESS_TEST: '1'
          PROJECTSEAL_TEST_IDENTITY: https://github.com/${{ github.workflow_ref }}
          PROJECTSEAL_TEST_ISSUER: https://token.actions.githubusercontent.com
        run: pytest tests/integration/test_real_cosign.py::test_live_keyless_sign_and_verify -v
