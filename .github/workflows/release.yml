name: Reviewed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the selected v* tag after protected-environment approval'
        type: boolean
        required: true
        default: false
      github_release:
        description: 'Create the signed GitHub Release for the selected version tag'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Require a tag matching the package version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_REF'] != f'refs/tags/v{version}':
              raise SystemExit('Run on the version tag matching pyproject.toml')
          PY
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  sign:
    if: github.event_name == 'push' || inputs.github_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Only distributions from the checked, version-matched tag are signed.
      # No checkout or execution of project code in this OIDC-enabled job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign and verify distribution bundles and checksum list
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.workflow_ref }}
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz > SHA256SUMS
          for file in *.whl *.tar.gz SHA256SUMS; do
            cosign sign-blob --yes --fulcio-auth-flow token --bundle "$file.sigstore.json" "$file"
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-distributions
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-distributions
          path: dist/
      - name: Publish checked and signed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cat > release-notes.md <<'EOF'
          Initial ProjectSeal CLI release. Python 3.11+ and Cosign 3.1.4 are required.

          Includes project UUID identities, streaming SHA-256, keyless and custom-key
          signing, `keygen --output-prefix`, explicit signer/public-key verification,
          canonical signed manifests, JSON output and overwrite protection.

          Install the wheel with `python -m pip install projectseal-0.1.0-py3-none-any.whl`.
          This GitHub Release does not imply the package has been published on PyPI.

          The wheel, sdist and SHA256SUMS each have a Sigstore bundle. The release
          workflow verified each bundle before upload. Obtain the expected workflow
          identity independently and verify before installing. Checksums alone are
          not publisher authentication. See docs/signing-guide.md and docs/publishing.md.
          EOF
          printf '\nExpected certificate identity: `%s`\n\nIssuer: `https://token.actions.githubusercontent.com`\n' "$EXPECTED_IDENTITY" >> release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --title "ProjectSeal $RELEASE_TAG" \
            --notes-file release-notes.md dist/*

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # External setup: required SAOYRG review and tag-only deployment rules.
    # The owner explicitly permits self-review for this single-maintainer project.
    environment:
      name: pypi
      url: https://pypi.org/p/projectseal
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout/install/build of repository code in this privileged job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist/
      - name: Trusted Publishing with Sigstore attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
