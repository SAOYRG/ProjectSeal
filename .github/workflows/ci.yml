name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=projectseal --cov-report=term-missing --cov-fail-under=85
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Check installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv .wheel-test
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON="$PWD/.wheel-test/Scripts/python.exe"
          else
            PYTHON="$PWD/.wheel-test/bin/python"
          fi
          "$PYTHON" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$PYTHON" -m projectseal --help
          "$PYTHON" -m projectseal --version
